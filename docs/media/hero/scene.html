<!doctype html>
<html><head><meta charset="utf-8">
<style>
:root{
  --bg:#0d1117; --ink:#e6edf3; --muted:#8b949e; --hunt:#f5b84a; --red:#ff6b6b; --green:#3fb950; --amber:#f5b84a;
  --pill:rgba(13,17,23,.62); --pillLine:rgba(240,246,252,.14); --pillHi:rgba(255,255,255,.07);
}
:root[data-theme="light"]{
  --bg:#ffffff; --ink:#1f2328; --muted:#59636e; --hunt:#9a6700; --red:#cf222e; --green:#1a7f37; --amber:#9a6700;
  --pill:rgba(255,255,255,.72); --pillLine:rgba(31,35,40,.13); --pillHi:rgba(255,255,255,.9);
}
html,body{margin:0;background:var(--bg);overflow:hidden;width:1280px;height:640px}
canvas{position:absolute;left:0;top:0}
#ui{position:absolute;inset:0;pointer-events:none;font-family:system-ui,-apple-system,"Helvetica Neue",sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
.brand{position:absolute;left:76px;top:178px}
.mark{display:flex;align-items:center;gap:14px}
.mark svg{flex:none;display:block;overflow:visible;color:var(--hunt)}
.word{font-size:62px;font-weight:680;letter-spacing:-0.045em;line-height:1}
.tag{margin-top:20px;font-size:22px;line-height:1.42;color:var(--muted);letter-spacing:-0.012em;white-space:nowrap}
.tag em{font-style:normal;color:var(--ink)}
.cmd{margin-top:28px;display:inline-block;font:500 16px/1 ui-monospace,"SF Mono",Menlo,monospace;color:var(--ink);
  padding:11px 15px;border-radius:10px;border:1px solid var(--pillLine);background:var(--pill);
  box-shadow:inset 0 1px 0 var(--pillHi)}
.cmd b{color:var(--hunt);font-weight:600}
.lab{position:absolute;left:0;top:0;white-space:nowrap;font:600 16px/1 ui-monospace,"SF Mono",Menlo,monospace;
  padding:8px 11px;border-radius:9px;border:1px solid var(--pillLine);background:var(--pill);color:var(--ink);
  display:flex;align-items:center;gap:8px;opacity:0;transform-origin:0 50%;
  -webkit-backdrop-filter:blur(12px) saturate(1.3);backdrop-filter:blur(12px) saturate(1.3);box-shadow:inset 0 1px 0 var(--pillHi)}
.lab.red{color:var(--red);border-color:color-mix(in srgb,var(--red) 55%,transparent)}
.lab.big{font-size:18px;padding:9px 12px}
.lab.solid{background:var(--red);color:#fff;border-color:transparent;letter-spacing:.05em;box-shadow:none;font-size:16px}
.lab.what{font:500 16px/1 system-ui,-apple-system,"Helvetica Neue",sans-serif;letter-spacing:-0.01em;padding:7px 11px}
.lab.chg{font-size:17px;padding:9px 12px}
.lab.fault{font-size:18px}
.lab.kcmd{font-weight:500;font-size:15px}
.lab.kcmd b{color:var(--hunt);font-weight:600}
.lab .dot{width:8px;height:8px;border-radius:50%;flex:none}
.lab .dot.r{background:var(--red);box-shadow:0 0 10px var(--red)}
.lab .dot.a{background:var(--amber);box-shadow:0 0 10px var(--amber)}
.lab .ok{display:flex;color:var(--green)}
.lab .sev{font-size:16px;letter-spacing:.05em;padding-left:10px;border-left:1px solid rgba(255,255,255,.5);opacity:.95}
.lab .mut{color:var(--muted)}
.log{position:absolute;left:78px;top:0;font:500 17px/1 ui-monospace,"SF Mono",Menlo,monospace;color:var(--muted)}
.log .ln{display:flex;align-items:center;gap:10px;height:29px;opacity:0;white-space:nowrap}
.log .ic{width:16px;height:16px;display:flex;align-items:center;justify-content:center;flex:none}
.log .ic .pend{width:9px;height:9px;border-radius:50%;border:1.6px solid currentColor;opacity:.75}
.log .ic .act{width:9px;height:9px;border-radius:50%;background:var(--amber);box-shadow:0 0 10px var(--amber)}
.log .ic .ok{display:flex;color:var(--green)}
.log .ic .no{display:flex;color:var(--red)}
.log .nm{width:13ch;flex:none}
.log .ln.on .nm{color:var(--ink)}
.log .ln.bad .nm,.log .ln.bad .rs{color:var(--red)}
.log .rs{display:flex;align-items:center;gap:8px}
.log .rt{padding:3px 7px;border-radius:6px;font-size:15px;border:1px solid color-mix(in srgb,var(--red) 50%,transparent)}
.ring{position:absolute;left:0;top:0;width:44px;height:44px;border-radius:50%;border:2px solid var(--red);opacity:0;pointer-events:none}
.gly{position:absolute;left:0;top:0;font:700 17px/1 ui-monospace,"SF Mono",Menlo,monospace;color:var(--amber);opacity:0;text-shadow:0 0 8px var(--amber)}
#ret{position:absolute;left:0;top:0;overflow:visible}
.sth{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:flex-start;gap:7px;opacity:0;white-space:nowrap}
.sth b{font:650 15px/1 ui-monospace,"SF Mono",Menlo,monospace;color:var(--ink);letter-spacing:.09em;text-transform:uppercase}
.sth span{font:500 15px/1 system-ui,-apple-system,"Helvetica Neue",sans-serif;color:var(--muted);letter-spacing:-0.005em}
:root[data-theme="dark"] .lab:not(.solid){box-shadow:inset 0 1px 0 var(--pillHi),0 8px 24px rgba(0,0,0,.45)}
:root[data-theme="light"] .lab:not(.solid),:root[data-theme="light"] .cmd{box-shadow:inset 0 1px 0 var(--pillHi),0 6px 18px rgba(31,35,40,.08),0 1px 2px rgba(31,35,40,.06)}
:root[data-theme="light"] .lab.solid{box-shadow:0 6px 18px rgba(207,34,46,.22)}
</style>

    L.log.forEach((e, i) => {
      const k = rampS(t, B.plan + i * 0.1, B.plan + i * 0.1 + 0.32), o = k * out;
      if (o <= 0.001) { if (e.style.opacity !== '0') e.style.opacity = '0'; return; }
      const st = t < S0[i] ? 'pend' : t < S1[i] ? 'act' : i === 3 ? 'no' : 'ok';
      const tag = st === 'no' ? (t >= LOCK2 ? '2/2' : '1/2') : '';
      if (e._st !== st + tag) {
        e._st = st + tag;
        e.className = 'ln' + (st === 'act' ? ' on' : '') + (st === 'no' ? ' bad' : '');
        e.querySelector('.ic').innerHTML = st === 'pend' ? '<span class="pend"></span>' : st === 'act' ? '<span class="act"></span>' : st === 'ok' ? okSvg : xSvg;
        e.querySelector('.rs').innerHTML = st === 'ok' ? PLAN[i][1] : st === 'no' ? `${PLAN[i][1]}<span class="rt">${tag}</span>` : '';
      }
      e.style.opacity = o.toFixed(3); e.style.transform = `translateX(${(-12 * (1 - k)).toFixed(2)}px)`;
      if (st === 'act') e.querySelector('.act').style.transform = `scale(${(1 + 0.28 * Math.sin((t - S0[i]) * TAU * 2.4)).toFixed(3)})`;
    });
  }
  // the brand mark follows the hunt: red when the reticle locks, green when the finding is kept
  {
    const p1 = t >= LOCK1 ? Math.exp(-(t - LOCK1) / 0.32) : 0;
    const red = clamp(Math.max(p1, win(t, LOCK2 - 0.02, LOCK2 + 0.06, B.keep + 0.15, B.land - 0.05)));
    const green = win(t, B.land - 0.04, B.land + 0.12, OUT[0], OUT[1]);
    const col = `color-mix(in srgb, var(--green) ${Math.round(green * 100)}%, color-mix(in srgb, var(--red) ${Math.round(red * 100)}%, var(--hunt)))`;
    if (L.mark._c !== col) { L.mark.style.color = col; L.mark._c = col; }
    const rk = (tl) => { const l = t - tl; return l >= 0 && l < 0.6 ? l / 0.6 : -1; };
    let q = rk(LOCK1), rc = 'var(--red)';
    if (q < 0) q = rk(LOCK2);
    if (q < 0) { q = rk(B.land); rc = 'var(--green)'; }
    if (q >= 0) {
      L.ring.style.borderColor = rc; L.ring.style.opacity = (Math.pow(1 - q, 1.6) * 0.8).toFixed(3);
      L.ring.style.transform = `translate(${(DOCK.mark[0] - 22).toFixed(1)}px,${(DOCK.mark[1] - 22).toFixed(1)}px) scale(${(0.66 + 0.42 * expoOut(q)).toFixed(3)})`;
    } else if (L.ring.style.opacity !== '0') L.ring.style.opacity = '0';
  }
  // reticle: brackets snap around the magnified value inside the lens
  {
    const lk = s.lock, o = win(t, LOCK1 - 0.1, LOCK1, B.keep - 0.05, B.keep + 0.2);
    if (o > 0) {
      const hw = lerp(s.lensR * 1.35, s.lensR * 0.8, lk), hh = lerp(s.lensR * 1.05, s.lensR * 0.52, lk), rot = lerp(32, 0, lk), arm = 14;
      const pop = 1 + 0.09 * win(t, LOCK2, LOCK2 + 0.04, LOCK2 + 0.08, LOCK2 + 0.3);
      const c = (sx, sy) => `<path d="M${sx * hw} ${sy * (hh - arm)}V${sy * hh}H${sx * (hw - arm)}" fill="none" stroke="var(--red)" stroke-width="2.6" stroke-linecap="round"/>`;
      L.ret.innerHTML = `<g transform="translate(${s.lx.toFixed(1)},${s.ly.toFixed(1)}) rotate(${rot.toFixed(2)}) scale(${pop.toFixed(3)})">${c(-1, -1)}${c(1, -1)}${c(-1, 1)}${c(1, 1)}</g>`;
    } else if (L.ret.innerHTML) L.ret.innerHTML = '';
    L.ret.style.opacity = o.toFixed(3);
  }
  // the verdict, beside the lens: 1/2, a fresh start, 2/2, then confirmed with its name
  {
    const repEl = L.rep.querySelector('#repn');
    const phase = t < B.reset - 0.05 ? 0 : t < LOCK2 ? 1 : 2;
    const want = ['1/2 reproduced', 'fresh start, run 2', '2/2 reproduced'][phase];
    if (repEl.textContent !== want) { repEl.textContent = want; L.rep._r = null; L.rep.classList.toggle('red', phase !== 1); }
    const pop = 1 + 0.1 * (phase === 2 ? win(t, LOCK2, LOCK2 + 0.05, LOCK2 + 0.1, LOCK2 + 0.3) : phase === 0 ? win(t, LOCK1 + 0.1, LOCK1 + 0.15, LOCK1 + 0.2, LOCK1 + 0.4) : 0);
    const x = s.lx - s.lensR - 20;
    for (const e of [L.rep, L.conf, L.what]) e.style.transformOrigin = '100% 50%';
    const gone = (a) => win(t, a, a + 0.14, B.keep - 0.02, B.keep + 0.14);
    place(L.rep, x, s.ly - 36, gone(LOCK1 + 0.1), 1, 0.5, pop);
    const cIn = rampS(t, B.confirm, B.confirm + 0.22);
    place(L.conf, x, s.ly + 6 + 8 * (1 - cIn), gone(B.confirm), 1, 0.5, 1 + 0.06 * win(t, B.confirm, B.confirm + 0.12, B.confirm + 0.16, B.confirm + 0.35));
    place(L.what, x, s.ly + 44, gone(B.confirm + 0.14), 1, 0.5, 1);
  }
  // kept tests: what the tray is, under it, and the command that keeps a finding, above it
  L.sth.style.transform = `translate(${HUD.x + 6}px,${HUD.y + HUD.h + 12}px)`; L.sth.style.opacity = (hudShow(t) * win(t, B.land - 0.2, B.land + 0.1, 99, 100)).toFixed(3);
  L.keep.style.transformOrigin = '100% 100%';
  place(L.keep, HUD.x + HUD.w, HUD.y - 8, win(t, B.land + 0.06, B.land + 0.22, OUT[0], OUT[1]), 1, 1);
}
</script>
