name: release

# Packs the tarball once, checks it installs and validates as a plugin on three
# OSes, then stages it on npm through trusted publishing (OIDC, no token). A
# maintainer approves the staged version on npmjs.com.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.0
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: The tag matches package.json and plugin.json
        run: |
          v="${GITHUB_REF_NAME#v}"
          test "$(node -p 'require("./package.json").version')" = "$v"
          test "$(node -p 'require("./.claude-plugin/plugin.json").version')" = "$v"
      - name: npm pack
        run: |
          npm pack --ignore-scripts
          sha512sum stillhunter-*.tgz | tee tarball.sha512
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tarball
          path: |
            stillhunter-*.tgz
            tarball.sha512

  test-tarball:
    name: test-tarball (${{ matrix.os }})
    needs: pack
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tarball
          path: tarball
      - name: Install the tarball and validate the plugin
        shell: bash
        run: |
          npm install --global @anthropic-ai/claude-code@2.1.311
          mkdir unpacked && tar -xzf tarball/stillhunter-*.tgz -C unpacked
          (cd unpacked/package && npm install --omit=dev --ignore-scripts --no-audit --no-fund)
          claude plugin validate --strict unpacked/package
          node unpacked/package/dist/hunt.mjs bogus | grep -q 'Usage:'

  publish:
    needs: [pack, test-tarball]
    if: vars.TRUSTED_PUBLISHING == 'on'
    runs-on: ubuntu-24.04
    environment: npm-release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.0
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.15.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tarball
          path: tarball
      - name: Check the tarball's sha512, then stage it
        working-directory: tarball
        run: |
          sha512sum --check tarball.sha512
          npm stage publish ./stillhunter-*.tgz
