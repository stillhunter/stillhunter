name: release

# Packs the tarball once, checks it installs and validates as a plugin on three
# OSes, then stages it on npm through trusted publishing (OIDC, no token). A
# maintainer approves the staged version on npmjs.com.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.0
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: The tag matches package.json and plugin.json
        run: |
          v="${GITHUB_REF_NAME#v}"
          test "$(node -p 'require("./package.json").version')" = "$v"
          test "$(node -p 'require("./.claude-plugin/plugin.json").version')" = "$v"
      - name: npm pack
        run: |
          npm pack --ignore-scripts
          sha512sum stillhunter-*.tgz | tee tarball.sha512
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tarball
          path: |
            stillhunter-*.tgz
            tarball.sha512

  test-tarball:
    name: test-tarball (${{ matrix.os }})
    needs: pack
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tarball
          path: tarball
      - name: Install the tarball and validate the plugin
        shell: bash
        run: |
          npm install --global @anthropic-ai/claude-code@2.1.311
          mkdir unpacked && tar -xzf tarball/stillhunter-*.tgz -C unpacked
          (cd unpacked/package && npm install --omit=dev --ignore-scripts --no-audit --no-fund)
          claude plugin validate --strict unpacked/package
      # Installs the tarball the way a user's Claude Code does: copied into the
      # plugin cache, with its packages installed from npm-shrinkwrap.json.
      # 0.2.0 shipped without a lockfile and so without playwright-core.
      - name: Install the tarball through Claude Code and run it
        shell: bash
        run: |
          mkdir -p pkg mkt/.claude-plugin
          tar -xzf tarball/stillhunter-*.tgz -C pkg --strip-components=1
          git -C pkg init -q
          git -C pkg add -A
          git -C pkg -c user.name=ci -c user.email=ci@example.invalid commit -qm tarball
          here="$PWD"
          if [ "$RUNNER_OS" = Windows ]; then here="/$(cygpath -m "$PWD")"; fi
          printf '{"name":"stillhunter","owner":{"name":"ci"},"plugins":[{"name":"stillhunter","source":{"source":"url","url":"file://%s/pkg"}}]}\n' "$here" > mkt/.claude-plugin/marketplace.json
          export CLAUDE_CONFIG_DIR="$PWD/cfg"
          claude plugin marketplace add ./mkt
          claude plugin install stillhunter@stillhunter
          root=$(ls -d cfg/plugins/cache/stillhunter/stillhunter/*/)
          test -f "$root/node_modules/playwright-core/package.json"
          # An unknown command prints the usage to stderr and exits 1.
          if out=$(node "$root/dist/hunt.mjs" bogus 2>&1); then echo 'expected a nonzero exit'; exit 1; fi
          grep -q 'Usage:' <<<"$out"

  publish:
    needs: [pack, test-tarball]
    if: vars.TRUSTED_PUBLISHING == 'on'
    runs-on: ubuntu-24.04
    environment: npm-release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.0
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.15.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tarball
          path: tarball
      - name: Check the tarball's sha512, then stage it
        working-directory: tarball
        run: |
          sha512sum --check tarball.sha512
          npm stage publish ./stillhunter-*.tgz
